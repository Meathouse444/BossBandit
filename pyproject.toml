[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossbandit"
version = "1.0.0"
description = "Finds, clips, captions and packages Twitch moments from 30+ (millennial) streamers for TikTok / Shorts / Reels."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
bossbandit = "bossbandit.cli:main"

[tool.setuptools]
packages = ["bossbandit"]

[tool.setuptools.package-data]
bossbandit = ["*.toml"]
